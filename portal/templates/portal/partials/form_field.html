{# Usage: {% include "portal/partials/form_field.html" with field=form.name hint="..." %} #}
<div class="field{% if field.errors %} has-error{% endif %}">
    <label class="field-label" for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if field.field.required and not field.field.disabled %}
            <span class="field-required" aria-hidden="true">*</span>
        {% endif %}
    </label>

    {{ field }}

    {% if hint %}
        <p class="field-hint">{{ hint }}</p>
    {% elif field.help_text %}
        <p class="field-hint">{{ field.help_text }}</p>
    {% endif %}

    {% for error in field.errors %}
        <p class="field-error">{{ error }}</p>
    {% endfor %}
</div>
